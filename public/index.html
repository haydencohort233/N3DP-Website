<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W263GWDX2V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      const host = location.hostname;

      // Don't track dev hosts
      const isDevHost =
        host === "localhost" ||
        host === "127.0.0.1" ||
        host.endsWith(".local");

      if (!isDevHost) {
        // If you use the React Router pageview hook, prevent automatic page_view here
        gtag("config", "G-W263GWDX2V", { send_page_view: false });
      }
    </script>
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon/favicon-16x16.png"
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon/favicon.ico" />

    <!-- Apple / iOS -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/favicon/apple-touch-icon.png"
    />

    <!-- PWA / Android -->
    <link rel="manifest" href="%PUBLIC_URL%/favicon/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- Basic SEO fallback -->
    <meta
      name="description"
      content="3D Printing Website - Request a quote!"
    />

    <title>Nashville3DPrints</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
